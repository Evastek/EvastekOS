<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evastek OS</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#04060C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Evastek OS">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060C; --surface:#0C101B; --surface-2:#121826; --surface-3:#1A2233;
  --border:#242C40; --border-soft:#161C2B;
  --text:#F2F4FA; --text-muted:#8B93AC; --text-faint:#565F79;
  --accent:#0158FE; --accent-soft:rgba(1,88,254,.16); --accent-dim:#0A3FB5;
  --warn:#F2B84B; --warn-soft:rgba(242,184,75,.12);
  --danger:#E5566B; --danger-soft:rgba(229,86,107,.12);
  --info:#38BDF8; --info-soft:rgba(56,189,248,.14);
  --font-d:'Sora',sans-serif; --font-b:'Inter',sans-serif; --font-m:'JetBrains Mono',monospace;
  --radius:10px;
}
*{box-sizing:border-box;}
svg{width:15px;height:15px;flex-shrink:0;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:14px;line-height:1.5;}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:600;margin:0;letter-spacing:-.01em;}
a{color:inherit;}
button{font-family:var(--font-b);cursor:pointer;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

#shell{display:flex;min-height:100vh;}

/* SIDEBAR */
#sidebar{width:232px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;padding:24px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 26px 8px;}
.brand-mark{width:30px;height:30px;border-radius:7px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.brand-mark img{width:100%;height:100%;object-fit:contain;padding:3px;box-sizing:border-box;}
.brand-os{font-family:var(--font-m);font-size:10px;letter-spacing:.14em;color:var(--accent);border:1px solid var(--accent-dim);border-radius:5px;padding:1px 6px;margin-left:2px;align-self:flex-start;}
.brand-text{font-family:var(--font-d);font-weight:800;font-size:15px;letter-spacing:-.01em;}
.brand-text .tek{color:var(--accent);}
.brand-sub{font-size:9.5px;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase;margin-top:1px;}
.nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);padding:18px 10px 8px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:9.5px 11px;border-radius:8px;color:var(--text-muted);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:3px;transition:background .12s,color .12s;}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);}
.nav-item .count{margin-left:auto;font-family:var(--font-m);font-size:10.5px;color:var(--text-faint);}
.nav-item.active .count{color:var(--accent);}
#sidebar-footer{margin-top:auto;padding:10px 10px 4px;font-size:10.5px;color:var(--text-faint);border-top:1px solid var(--border-soft);padding-top:12px;}

/* MAIN */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;gap:14px;padding:16px 32px;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:rgba(6,8,16,.92);backdrop-filter:blur(6px);z-index:20;}
#search-box{flex:1;max-width:420px;position:relative;}
#search-input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 32px;color:var(--text);font-size:13px;outline:none;}
#search-input:focus{border-color:var(--accent-dim);}
#search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-faint);}
#search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;max-height:60vh;overflow-y:auto;box-shadow:0 12px 32px rgba(0,0,0,.4);display:none;z-index:30;}
#search-results.show{display:block;}
.sr-group-label{font-size:10px;text-transform:uppercase;color:var(--text-faint);letter-spacing:.06em;padding:9px 12px 4px;}
.sr-item{padding:8px 12px;font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;}
.sr-item:hover{background:var(--surface-3);}
.sr-item .sr-sub{color:var(--text-faint);font-size:11px;}
#topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.user-chip{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border-soft);padding:5px 10px 5px 5px;border-radius:20px;font-size:12px;color:var(--text-muted);}
.user-avatar{width:22px;height:22px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--accent);}

#content{padding:34px 40px 70px;max-width:1440px;width:100%;margin:0 auto;}

/* GENERIC PIECES */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap;}
.page-title{font-size:21px;}
.page-sub{color:var(--text-muted);font-size:12.5px;margin-top:4px;}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#F2F4FA;border:none;padding:9px 14px;border-radius:8px;font-size:12.5px;font-weight:600;white-space:nowrap;}
.btn svg{width:14px;height:14px;flex-shrink:0;}
.btn:hover{background:#2A72FF;}
.btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.btn.secondary:hover{background:var(--surface-3);}
.btn.danger{background:var(--danger-soft);color:var(--danger);border:1px solid transparent;}
.btn.ghost{background:transparent;color:var(--text-muted);padding:6px 8px;}
.btn.ghost:hover{color:var(--text);}
.btn.small{padding:6px 10px;font-size:11.5px;}

.grid{display:grid;gap:18px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}}

.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px;}
.stat-card .stat-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
.stat-card .stat-value{font-family:var(--font-d);font-size:26px;margin-top:8px;}
.stat-card .stat-value.small{font-size:20px;}

.section-title{font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin:32px 0 14px;}
.section-title:first-child{margin-top:0;}

table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border-soft);}
td{padding:13px 14px;border-bottom:1px solid var(--border-soft);font-size:13px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.row-click{cursor:pointer;}
tr.row-click:hover td{background:var(--surface-2);}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;font-family:var(--font-m);white-space:nowrap;}
.badge.dot::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;}
.badge.green{background:var(--accent-soft);color:var(--accent);}
.badge.amber{background:var(--warn-soft);color:var(--warn);}
.badge.red{background:var(--danger-soft);color:var(--danger);}
.badge.blue{background:var(--info-soft);color:var(--info);}
.badge.gray{background:var(--surface-3);color:var(--text-muted);}
.badge.demo{background:var(--surface-3);color:var(--text-faint);font-weight:500;}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-faint);}
.empty-state h3{color:var(--text-muted);font-size:14px;margin-bottom:6px;}
.empty-state p{font-size:12.5px;max-width:340px;margin:0 auto;}

/* TABS */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-soft);margin-bottom:24px;overflow-x:auto;}
.tab{padding:10px 15px;font-size:12.5px;color:var(--text-muted);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(6,8,11,.6);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto;}
#modal-overlay.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:560px;padding:28px;margin-top:10px;}
.modal.wide{max-width:760px;}
#modal-inner{width:100%;display:flex;justify-content:center;}
.modal-sub{font-size:12.5px;color:var(--text-muted);margin:-12px 0 20px;}
#modal-fields{display:grid;grid-template-columns:1fr;column-gap:14px;}
.modal.wide #modal-fields{grid-template-columns:1fr 1fr;}
.field.full,.form-section{grid-column:1/-1;}
.form-section{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:8px 0 14px;padding-bottom:7px;border-bottom:1px solid var(--border-soft);}
.form-section:first-child{margin-top:0;}
.field .req{color:var(--danger,#E5566B);margin-left:2px;}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger,#E5566B);}
.field-err{color:var(--danger,#E5566B);font-size:11.5px;margin-top:4px;min-height:0;}
.form-error{color:var(--danger,#E5566B);font-size:12.5px;margin-top:2px;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.field .hint{font-size:11px;color:var(--text-faint);margin-top:4px;}
@media(max-width:640px){.modal{padding:20px;}.modal.wide #modal-fields{grid-template-columns:1fr;}#modal-overlay{padding:16px 10px;}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.modal-header h3{font-size:16px;}
.modal-close{background:none;border:none;color:var(--text-faint);font-size:18px;padding:4px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:5px;font-weight:500;}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--text);font-size:13px;font-family:var(--font-b);outline:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-dim);}
.field textarea{resize:vertical;min-height:64px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border-soft);}

/* PROGRESS */
.progress-track{width:100%;height:6px;background:var(--surface-3);border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:6px;}

/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;}
.kanban-col{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:10px;min-height:120px;}
.kanban-col-title{font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;padding:4px 6px 10px;display:flex;justify-content:space-between;}
.kanban-card{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:9px;padding:10px;margin-bottom:8px;font-size:12.5px;cursor:pointer;}
.kanban-card:hover{border-color:var(--border);}
.kanban-card .kc-title{font-weight:600;margin-bottom:6px;}
.kanban-card .kc-meta{display:flex;justify-content:space-between;color:var(--text-faint);font-size:10.5px;}

/* MISC */
.flex{display:flex;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.flex-gap{display:flex;gap:8px;align-items:center;}
.muted{color:var(--text-muted);}
.faint{color:var(--text-faint);font-size:11.5px;}
.mono{font-family:var(--font-m);}
.mb-0{margin-bottom:0;}
.divider{height:1px;background:var(--border-soft);margin:18px 0;}
.client-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:10px;}
.client-avatar{width:44px;height:44px;border-radius:10px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;font-size:16px;color:var(--accent);}
.pill-list{display:flex;flex-wrap:wrap;gap:8px;}
.kv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 24px;}
.kv-grid .k{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.kv-grid .v{font-size:13px;}
.checklist-row{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;}
.checklist-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);}
.checklist-row.done span{text-decoration:line-through;color:var(--text-faint);}
.mini-list-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:13px 0;border-bottom:1px solid var(--border-soft);}
.mini-list-item:last-child{border-bottom:none;}
.icon-btn{background:none;border:none;color:var(--text-faint);padding:4px;}
.icon-btn svg{width:15px;height:15px;flex-shrink:0;}
.icon-btn:hover{color:var(--text);}
.icon-btn.danger:hover{color:var(--danger);}
svg.faint{width:14px;height:14px;flex-shrink:0;}
.funnel-stage{flex:1;text-align:center;padding:14px 8px;border-right:1px solid var(--border-soft);}
.funnel-stage:last-child{border-right:none;}
.funnel-stage .fs-value{font-family:var(--font-d);font-size:20px;}
.funnel-stage .fs-label{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.funnel-stage .fs-rate{font-size:10.5px;color:var(--accent);margin-top:4px;font-family:var(--font-m);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface-3);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:8px;font-size:12.5px;z-index:200;opacity:0;transform:translateY(8px);transition:all .2s;}
.toast.show{opacity:1;transform:translateY(0);}
.loading-state{display:flex;align-items:center;justify-content:center;padding:80px;color:var(--text-faint);font-size:12.5px;}

/* GUIA */
.guide-layout{display:grid;grid-template-columns:230px 1fr;gap:36px;align-items:start;}
.guide-nav{position:sticky;top:20px;display:flex;flex-direction:column;gap:2px;}
.guide-nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);padding:4px 10px 8px;}
.guide-nav a{display:block;padding:7px 10px;border-radius:7px;font-size:12.5px;color:var(--text-muted);text-decoration:none;}
.guide-nav a:hover{background:var(--surface-2);color:var(--text);}
.guide-intro{margin-bottom:8px;}
.guide-intro p{font-size:13.5px;color:var(--text-muted);max-width:640px;margin:0 0 10px;}
.guide-section{scroll-margin-top:20px;margin-bottom:16px;padding-bottom:28px;border-bottom:1px solid var(--border-soft);}
.guide-section:last-child{border-bottom:none;}
.guide-section h3{font-size:16px;margin-bottom:4px;}
.guide-eyebrow{display:inline-block;font-family:var(--font-m);font-size:10px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.guide-section p{font-size:13px;color:var(--text-muted);line-height:1.65;margin:8px 0;max-width:720px;}
.guide-tip{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--border-soft);border-radius:9px;padding:11px 13px;margin-top:10px;max-width:720px;}
.guide-tip svg{width:14px;height:14px;color:var(--accent);flex-shrink:0;margin-top:2px;}
.guide-tip span{font-size:12px;color:var(--text-muted);}
@media(max-width:900px){.guide-layout{grid-template-columns:1fr;}.guide-nav{position:static;flex-direction:row;flex-wrap:wrap;}}
/* PÁGINA PÚBLICA DO CLIENTE (agendamento) */
#pub{min-height:100vh;align-items:center;justify-content:center;padding:20px;}
#pub .pub-wrap{width:100%;max-width:520px;}
#pub .pcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;font-size:15px;line-height:1.55;}
#pub h1{font-size:20px;margin:0 0 6px;}
#pub p{margin:10px 0;color:#C9CEDF;}
#pub .pmeta{display:flex;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:10px;padding:12px 14px;margin:14px 0;font-size:13px;color:var(--text-muted);}
#pub .pmeta b{display:block;font-size:15px;color:var(--text);}
#pub .popt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface-2);border:1.5px solid var(--border);border-radius:10px;padding:14px;margin:8px 0;color:var(--text);font:inherit;cursor:pointer;}
#pub .popt.sel{border-color:var(--accent);background:var(--accent-soft);}
#pub .popt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--text-muted);flex-shrink:0;}
#pub .popt.sel .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%);}
#pub .pbtn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:14px;font:600 15px var(--font-b);margin-top:14px;cursor:pointer;}
#pub .pbtn:disabled{opacity:.45;cursor:not-allowed;}
#pub .pbtn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-muted);}
#pub .pnote{font-size:13px;color:var(--text-muted);}
#pub .perr{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px;}
#pub .pok{color:#3DD598;font-size:38px;line-height:1;}

/* ===== REORGANIZAÇÃO v2 ===== */
.help-box{background:var(--accent-soft);border:1px solid var(--accent-dim);border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--text);margin:0 0 20px;display:flex;gap:10px;align-items:flex-start;line-height:1.5;}
.help-box svg{color:var(--accent);margin-top:2px;}
.subtabs{display:flex;gap:6px;margin:-8px 0 16px;flex-wrap:wrap;}
.subtab{padding:7px 14px;font-size:12.5px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border-soft);color:var(--text-muted);cursor:pointer;font-weight:500;}
.subtab:hover{color:var(--text);}
.subtab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.quick-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.attn-item,.todo-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-soft);}
.attn-item:last-child,.todo-row:last-child{border-bottom:none;}
.attn-item[data-i],.todo-main[data-i]{cursor:pointer;}
.attn-item .attn-text,.todo-main{flex:1;min-width:0;}
.attn-title{font-size:13px;font-weight:600;}
.attn-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
.done-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);background:transparent;color:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;}
.done-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.done-btn svg{width:14px;height:14px;}
.client-tile{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .12s;}
.client-tile:hover{border-color:var(--accent-dim);}
.client-tile .ct-name{font-weight:600;font-size:14px;}
.client-tile .ct-sub{font-size:11.5px;color:var(--text-faint);margin:2px 0 12px;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.chip{padding:6px 13px;font-size:12px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border-soft);color:var(--text-muted);cursor:pointer;font-weight:500;}
.chip.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-dim);}
.chip .n{font-family:var(--font-m);font-size:10.5px;margin-left:5px;opacity:.8;}
.chip-select{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;font-size:12px;margin-left:auto;}
.glossary-row{display:grid;grid-template-columns:150px 1fr;gap:6px 18px;padding:14px 0;border-bottom:1px solid var(--border-soft);}
.glossary-row:last-child{border-bottom:none;}
.glossary-row .g-term{font-family:var(--font-d);font-weight:600;font-size:14px;}
.glossary-row .g-def{font-size:13px;}
.glossary-row .g-meta{font-size:11.5px;color:var(--text-faint);margin-top:3px;}
@media(max-width:820px){
  #shell{flex-direction:column;}
  #sidebar{width:100%;height:auto;position:sticky;top:0;z-index:25;flex-direction:row;align-items:center;gap:4px;padding:8px 10px;overflow-x:auto;overflow-y:hidden;border-right:none;border-bottom:1px solid var(--border-soft);}
  #sidebar .brand{display:none;}
  .nav-group-label,#sidebar-footer{display:none;}
  .nav-item{margin:0;white-space:nowrap;padding:8px 11px;}
  #topbar{position:static;padding:10px 14px;}
  #content{padding:18px 14px 60px;}
  .card{overflow-x:auto;}
  .grid.cols-2,.grid.cols-3{grid-template-columns:1fr;}
  .glossary-row{grid-template-columns:1fr;}
  .user-chip{display:none;}
}

.ajuda-sec{margin:0 0 16px;}
.ajuda-sec h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:6px;font-family:var(--font-b);font-weight:600;}
.ajuda-sec p,.ajuda-sec li{font-size:13px;line-height:1.55;}
.ajuda-sec ol{margin:0;padding-left:20px;}
.ajuda-sec li{margin-bottom:5px;}
.ajuda-tip{background:var(--warn-soft);border-radius:8px;padding:10px 12px;font-size:12.5px;}
.help-box .hb-btn{margin-left:auto;flex-shrink:0;}
</style>
</head>

async function persist(){
  try{
    await setDoc(stateDocRef, JSON.parse(JSON.stringify(state)));
  }catch(e){
    console.error('Falha ao salvar', e);
    if(e && e.code === 'permission-denied'){
      showToast('Sem permissão pra salvar no Firestore — as alterações NÃO estão sendo gravadas. Veja as regras do banco.');
    }else{
      showToast('Erro ao salvar. Tente novamente.');
    }
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

async function loadState(){
  try{
    const snap = await getDoc(stateDocRef);
    if(snap.exists()){
      state = snap.data();
    }else{
      state = seedData();
      await persist();
    }
  }catch(e){
    console.error('Falha ao carregar do Firestore', e);
    state = seedData();
    if(e && e.code === 'permission-denied'){
      showToast('Sem acesso ao Firestore — mostrando dados de demonstração (nada será salvo). Veja as regras do banco.');
    }else{
      showToast('Não foi possível conectar ao banco de dados. Mostrando dados de demonstração.');
    }
  }
  loaded = true;
}

function fmtDate(d){ if(!d) return '—'; try{ const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('pt-BR'); }catch(e){ return d; } }
function fmtMoney(v){ v = Number(v)||0; return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function isOverdue(dateStr, status){ if(!dateStr || (status && (status==='Concluída'||status==='Concluído'))) return false; return new Date(dateStr+'T23:59:59') < new Date(); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl2br(s){ return escapeHtml(s).replace(/\n/g,'<br>'); }

function priorityBadge(p){
  const map = {'Baixa':'gray','Média':'blue','Alta':'amber','Urgente':'red'};
  return `<span class="badge ${map[p]||'gray'}">${escapeHtml(p||'—')}</span>`;
}
function statusBadge(s){
  const map = {'Ativo':'green','Ativa':'green','Em andamento':'blue','A fazer':'gray','Em revisão':'amber','Concluída':'green','Concluído':'green',
    'Pausada':'amber','Finalizada':'gray','Analisada':'gray','Planejamento':'blue','Inativo':'red','Pendente':'gray'};
  return `<span class="badge ${map[s]||'gray'}">${escapeHtml(s||'—')}</span>`;
}
function demoBadge(demo){ return demo ? `<span class="badge demo">Dados de demonstração</span>` : ''; }

function runSearch(q){
  const box = document.getElementById('search-results');
  q = q.trim().toLowerCase();
  if(!q){ box.classList.remove('show'); box.innerHTML=''; return; }
  const groups = [];
  function match(items, fields){ return items.filter(it => fields.some(f => String(it[f]||'').toLowerCase().includes(q))); }

  const clients = match(state.clients, ['nome','empresa','segmento']);
  if(clients.length) groups.push({label:'Clientes', items: clients.map(c=>({title:c.nome, sub:c.empresa, action:()=>goto('clientes',{clientId:c.id})}))});

  const projects = match(state.projects, ['nome','objetivo']);
  if(projects.length) groups.push({label:'Projetos', items: projects.map(p=>({title:p.nome, sub:clientName(p.clienteId), action:()=>goto('clientes',{clientId:p.clienteId, clientTab:'projetos'})}))});

  const tasks = match(state.tasks, ['titulo','descricao']);
  if(tasks.length) groups.push({label:'Tarefas', items: tasks.map(t=>({title:t.titulo, sub:clientName(t.clienteId), action:()=>goto('clientes',{clientId:t.clienteId, clientTab:'tarefas'})}))});

  const docs = match(state.documents, ['titulo','conteudo']);
  if(docs.length) groups.push({label:'Documentos', items: docs.map(d=>({title:d.titulo, sub:clientName(d.clienteId), action:()=>goto('clientes',{clientId:d.clienteId, clientTab:'documentos'})}))});

  const camps = match(state.campaigns, ['nome','mensagem']);
  if(camps.length) groups.push({label:'Campanhas', items: camps.map(c=>({title:c.nome, sub:clientName(c.clienteId), action:()=>goto('clientes',{clientId:c.clienteId, clientTab:'campanhas'})}))});

  const prods = match(state.products, ['nome','sku']);
  if(prods.length) groups.push({label:'Produtos', items: prods.map(p=>({title:p.nome, sub:clientName(p.clienteId), action:()=>goto('clientes',{clientId:p.clienteId, clientTab:'produtos'})}))});

  const decs = match(state.decisions, ['decisao','motivo']);
  if(decs.length) groups.push({label:'Decisões', items: decs.map(d=>({title:d.decisao, sub:clientName(d.clienteId), action:()=>goto('clientes',{clientId:d.clienteId, clientTab:'decisoes'})}))});

  if(!groups.length){
    box.innerHTML = `<div class="sr-item faint">Nenhum resultado para "${escapeHtml(q)}"</div>`;
  } else {
    box.innerHTML = groups.map((g,gi)=>`
      <div class="sr-group-label">${g.label}</div>
      ${g.items.slice(0,5).map((it,ii)=>`<div class="sr-item" data-g="${gi}" data-i="${ii}"><span>${escapeHtml(it.title)}</span><span class="sr-sub">${escapeHtml(it.sub||'')}</span></div>`).join('')}
    `).join('');
    box.querySelectorAll('.sr-item[data-g]').forEach(elm=>{
      elm.addEventListener('mousedown', ()=>{
        const g = groups[+elm.dataset.g]; const it = g.items[+elm.dataset.i];
        it.action(); box.classList.remove('show');
        document.getElementById('search-input').value='';
      });
    });
  }
  box.classList.add('show');
}

/* ============================= MODAL / FORM ENGINE ============================= */
function closeModal(){ const ov = document.getElementById('modal-overlay'); ov.classList.remove('show'); delete ov.dataset.lock; document.getElementById('modal-inner').innerHTML=''; }

function fieldHtml(f, val){
  val = val==null ? '' : val;
  const id = 'f_' + f.key;
  const lab = `<label for="${id}">${f.label}${f.required ? '<span class="req">*</span>' : ''}</label>`;
  const tail = `${f.hint ? `<div class="hint">${f.hint}</div>` : ''}<div class="field-err"></div>`;
  const ph = escapeHtml(f.placeholder || '');
  let ctl;
  if(f.type==='textarea') ctl = `<textarea id="${id}" placeholder="${ph}">${escapeHtml(val)}</textarea>`;
  else if(f.type==='select'){
    const opts = f.options && f.options.length ? f.options : [''];
    ctl = `<select id="${id}">${opts.map(o=>`<option value="${escapeHtml(o)}" ${o===val?'selected':''}>${o==='' ? '— Selecione —' : escapeHtml(o)}</option>`).join('')}</select>`;
  }
  else if(f.type==='number') ctl = `<input type="number" step="any" id="${id}" value="${escapeHtml(val)}" placeholder="${ph}">`;
  else if(f.type==='date') ctl = `<input type="date" id="${id}" value="${escapeHtml(val)}">`;
  else ctl = `<input type="${f.type==='tel'?'tel':'text'}" id="${id}" value="${escapeHtml(val)}" placeholder="${ph}" autocomplete="off">`;
  return `<div class="field ${f.type==='textarea' || f.full ? 'full' : ''}">${lab}${ctl}${tail}</div>`;
}

function formError(msg){ const e = document.getElementById('modal-error'); if(e) e.textContent = msg || ''; }

// fields: lista de campos; {section:'Título'} cria um cabeçalho de grupo; required:true valida; onSave pode retornar false para manter o formulário aberto
function openForm({title, subtitle, fields, values, onSave, wide, saveLabel}){
  values = values || {};
  const inputs = fields.filter(f=>!f.section);
  const inner = document.getElementById('modal-inner');
  inner.innerHTML = `
    <div class="modal ${wide?'wide':''}">
      <div class="modal-header"><h3>${title}</h3><button class="modal-close" id="modal-x" aria-label="Fechar">&times;</button></div>
      ${subtitle ? `<div class="modal-sub">${subtitle}</div>` : ''}
      <div id="modal-fields">${fields.map(f=> f.section ? `<div class="form-section">${f.section}</div>` : fieldHtml(f, values[f.key])).join('')}</div>
      <div class="form-error" id="modal-error"></div>
      <div class="modal-actions">
        <button class="btn secondary" id="modal-cancel">Cancelar</button>
        <button class="btn" id="modal-save">${saveLabel || 'Salvar'}</button>
      </div>
    </div>`;
  const ov = document.getElementById('modal-overlay'); ov.classList.add('show'); ov.dataset.lock = '1';
  document.getElementById('modal-x').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  const btn = document.getElementById('modal-save');
  const save = async ()=>{
    if(btn.disabled) return;
    formError('');
    const out = {}; let firstBad = null;
    inputs.forEach(f=>{
      const el = document.getElementById('f_'+f.key), fld = el.closest('.field');
      fld.classList.remove('invalid'); fld.querySelector('.field-err').textContent = '';
      const raw = el.value.trim();
      if(f.required && !raw){ fld.classList.add('invalid'); fld.querySelector('.field-err').textContent = 'Campo obrigatório'; if(!firstBad) firstBad = el; }
      out[f.key] = f.type==='number' ? (raw==='' ? 0 : Number(raw)) : raw;
    });
    if(firstBad){ firstBad.focus(); return; }
    btn.disabled = true; btn.textContent = 'Salvando...';
    try{
      const r = await onSave(out);
      if(r !== false && document.getElementById('modal-save') === btn){ closeModal(); return; }
    }catch(e){ console.error(e); formError('Não foi possível salvar. Tente novamente.'); }
    if(document.getElementById('modal-save') === btn){ btn.disabled = false; btn.textContent = saveLabel || 'Salvar'; }
  };
  btn.onclick = save;
  inner.querySelectorAll('input').forEach(i=> i.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } }));
  const first = inner.querySelector('input:not([type=date]),textarea');
  if(first && window.innerWidth > 640) first.focus();
}

function confirmDelete(msg, onYes){
  const inner = document.getElementById('modal-inner');
  inner.innerHTML = `
    <div class="modal">
      <div class="modal-header"><h3>Confirmar exclusão</h3><button class="modal-close" id="modal-x">&times;</button></div>
      <p class="muted" style="font-size:13px;">${msg}</p>
      <div class="modal-actions">
        <button class="btn secondary" id="modal-cancel">Cancelar</button>
        <button class="btn danger" id="modal-del">Excluir</button>
      </div>
    </div>`;
  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('modal-x').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-del').onclick = ()=>{ onYes(); closeModal(); };
}

function contratoInfo(cl){
  const a = cl.agendamento;
  if(!a || a.status!=='Confirmado') return null;
  const fim = calcFim(a.escolhida, a.duracaoDias, a.regra);
  if(!fim) return null;
  return {fim, rest: diasRestantes(fim)};
}
function pickClient(title, subtitle, cb){
  if(!state.clients.length){ showToast('Cadastre um cliente primeiro.'); goto('clientes'); return; }
  if(state.clients.length===1){ cb(state.clients[0].id); return; }
  openForm({title, subtitle, saveLabel:'Continuar',
    fields:[{key:'cliente', label:'Para qual cliente?', type:'select', options:['', ...CLIENT_OPTIONS()], required:true}],
    onSave: async (v)=>{ const id = clientIdByName(v.cliente); if(!id){ formError('Escolha um cliente.'); return false; } setTimeout(()=>cb(id), 0); }
  });
}
function taskRowHtml(t, i){
  const od = isOverdue(t.prazo, t.status);
  return `<div class="todo-row">
    <button class="done-btn" data-done="${i}" title="Marcar como concluída">${icon('check')}</button>
    <div class="todo-main" data-i="${i}">
      <div class="attn-title">${escapeHtml(t.titulo)}</div>
      <div class="attn-sub">${escapeHtml(clientName(t.clienteId))}${t.responsavel?' · '+escapeHtml(t.responsavel):''}</div>
    </div>
    <span class="badge ${od?'red':'gray'}">${od?'Atrasada · ':''}${fmtDate(t.prazo)}</span>
  </div>`;
}
function bindTaskRows(root, list){
  root.querySelectorAll('[data-done]').forEach(b=> b.addEventListener('click', async (e)=>{
    e.stopPropagation(); const t = list[+b.dataset.done]; if(!t) return;
    t.status = 'Concluída'; await persist(); showToast('Tarefa concluída.'); render();
  }));
  root.querySelectorAll('.todo-main[data-i]').forEach(el=> el.addEventListener('click', ()=>{
    const t = list[+el.dataset.i]; if(t) goto('clientes',{clientId:t.clienteId, clientTab:'tarefas'});
  }));
}

/* ============================= INÍCIO (antigo Dashboard) ============================= */
function renderDashboard(){
  const hoje = todayIso();
  const abertas = state.tasks.filter(t=>t.status!=='Concluída');
  const atrasadas = abertas.filter(t=>isOverdue(t.prazo, t.status)).sort((a,b)=>(a.prazo||'').localeCompare(b.prazo||''));
  const doDia = abertas.filter(t=>t.prazo===hoje);
  const prox7 = abertas.filter(t=>t.prazo && t.prazo>hoje && t.prazo<=addDays(hoje,7)).sort((a,b)=>a.prazo.localeCompare(b.prazo));
  const agora = atrasadas.concat(doDia);
  const clientesAtivos = state.clients.filter(c=>c.status==='Ativo');
  const campAtivas = state.campaigns.filter(c=>c.status==='Ativa').length;

  const att = [];
  state.clients.forEach(c=>{
    const ci = contratoInfo(c);
    if(ci && ci.rest<=15) att.push({level: ci.rest<0?'red':'amber', text: ci.rest<0 ? `Contrato de ${c.nome} encerrado` : `Contrato de ${c.nome} termina em ${ci.rest} dia(s)`, sub:'Encerramento: '+fmtDate(ci.fim), go:()=>goto('clientes',{clientId:c.id, clientTab:'agendamento'})});
    if(c.agendamento && c.agendamento.status==='Aguardando') att.push({level:'amber', text:`${c.nome} ainda não escolheu a data de início`, sub:'Aguardando resposta do cliente', go:()=>goto('clientes',{clientId:c.id, clientTab:'agendamento'})});
  });
  state.campaigns.forEach(c=>{
    if(c.status==='Ativa' && c.periodoFim && new Date(c.periodoFim+'T23:59:59') < new Date(Date.now()+3*86400000))
      att.push({level:'amber', text:`Campanha "${c.nome}" está perto do fim`, sub:clientName(c.clienteId), go:()=>goto('clientes',{clientId:c.clienteId, clientTab:'campanhas'})});
  });

  const dataLonga = new Date().toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'});
  document.getElementById('content').innerHTML = `
    <div class="page-header">
      <div><div class="page-title">Início</div><div class="page-sub" style="text-transform:capitalize;">${dataLonga}</div></div>
    </div>
    <div class="quick-actions">
      <button class="btn" id="qa-task">${icon('plus')} Nova tarefa</button>
      <button class="btn secondary" id="qa-meet">${icon('plus')} Registrar reunião</button>
      <button class="btn secondary" id="qa-client">${icon('plus')} Novo cliente</button>
    </div>

    <div class="grid cols-4">
      <div class="card stat-card"><div class="stat-label">Clientes ativos</div><div class="stat-value">${clientesAtivos.length}</div></div>
      <div class="card stat-card"><div class="stat-label">Tarefas em aberto</div><div class="stat-value">${abertas.length}</div></div>
      <div class="card stat-card"><div class="stat-label">Atrasadas</div><div class="stat-value" style="color:${atrasadas.length?'var(--danger)':'var(--text)'}">${atrasadas.length}</div></div>
      <div class="card stat-card"><div class="stat-label">Campanhas ativas</div><div class="stat-value">${campAtivas}</div></div>
    </div>

    <div class="grid cols-2" style="margin-top:20px;align-items:start;">
      <div class="card">
        <div class="flex-between" style="margin-bottom:6px;"><h4>Fazer agora (${agora.length})</h4><button class="btn ghost small" id="go-tasks">Ver todas &rarr;</button></div>
        <div id="todo-now">${agora.length ? agora.map((t,i)=>taskRowHtml(t,i)).join('') : '<p class="faint" style="padding:14px 0;">Nada atrasado nem para hoje. 🎉</p>'}</div>
        ${prox7.length ? `<div class="section-title" style="margin:18px 0 4px;">Próximos 7 dias</div><div id="todo-next">${prox7.map((t,i)=>taskRowHtml(t,i)).join('')}</div>` : ''}
      </div>
      <div class="card">
        <h4 style="margin-bottom:6px;">Precisa de atenção</h4>
        ${att.length ? att.map((a,i)=>`<div class="attn-item" data-i="${i}"><span class="badge ${a.level} dot"></span><div class="attn-text"><div class="attn-title">${escapeHtml(a.text)}</div><div class="attn-sub">${escapeHtml(a.sub||'')}</div></div>${icon('chev','faint')}</div>`).join('') : '<p class="faint" style="padding:14px 0;">Nenhum alerta no momento.</p>'}
      </div>
    </div>

    <div class="section-title">Seus clientes</div>
    ${state.clients.length ? `<div class="grid cols-3">${state.clients.map(cl=>{
      const ab = abertas.filter(t=>t.clienteId===cl.id), at = ab.filter(t=>isOverdue(t.prazo,t.status)).length, ci = contratoInfo(cl);

let taskFilter = 'abertas', taskClientFilter = '';
function renderTarefasGlobal(){
  const hoje = todayIso();
  const filtros = {
    abertas:   t=> t.status!=='Concluída',
    hoje:      t=> t.status!=='Concluída' && t.prazo===hoje,
    atrasadas: t=> isOverdue(t.prazo, t.status),
    concluidas:t=> t.status==='Concluída',
    todas:     t=> true,
  };
  const chips = [['abertas','Em aberto'],['hoje','Hoje'],['atrasadas','Atrasadas'],['concluidas','Concluídas'],['todas','Todas']];
  const base = taskClientFilter ? state.tasks.filter(t=>t.clienteId===taskClientFilter) : state.tasks;
  const items = base.filter(filtros[taskFilter]||filtros.abertas).sort((a,b)=>(a.prazo||'9999').localeCompare(b.prazo||'9999'));

    <div class="chip-row">
      ${chips.map(([k,l])=>`<div class="chip ${taskFilter===k?'active':''}" data-f="${k}">${l}<span class="n">${base.filter(filtros[k]).length}</span></div>`).join('')}
      <select class="chip-select" id="tg-client"><option value="">Todos os clientes</option>${state.clients.map(cl=>`<option value="${cl.id}" ${taskClientFilter===cl.id?'selected':''}>${escapeHtml(cl.nome)}</option>`).join('')}</select>

function deleteClient(clienteId){
  const cl = state.clients.find(c=>c.id===clienteId);
  if(!cl) return;
  const related = ['projects','tasks','meetings','campaigns','contents','metrics','products','documents','decisions','learnings','strategies']
    .reduce((sum,key)=> sum + state[key].filter(item=>item.clienteId===clienteId).length, 0);
  const msg = related
    ? `Excluir "${escapeHtml(cl.nome)}" também vai apagar todos os registros ligados a ele — ${related} no total (projetos, tarefas, reuniões, campanhas, conteúdos, métricas, produtos, documentos, decisões, aprendizados e estratégia). Essa ação não pode ser desfeita.`
    : `Excluir "${escapeHtml(cl.nome)}"? Essa ação não pode ser desfeita.`;
  confirmDelete(msg, async ()=>{
    ['projects','tasks','meetings','campaigns','contents','metrics','products','documents','decisions','learnings','strategies'].forEach(key=>{
      state[key] = state[key].filter(item=>item.clienteId!==clienteId);
    });
    state.clients = state.clients.filter(c=>c.id!==clienteId);
    await persist(); showToast('Cliente excluído.');
    goto('clientes');
  });
}

/* ============================= PRAZO CONTRATUAL ============================= */
const REGRAS = {inclui:'O dia de início conta como dia 1', seguinte:'A contagem começa no dia seguinte ao início'};
function addDays(iso, n){ const [y,m,d] = iso.split('-').map(Number); return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10); }
function calcFim(inicio, dias, regra){ if(!inicio || !dias || !REGRAS[regra]) return null; return addDays(inicio, regra==='inclui' ? dias-1 : dias); }
function diasRestantes(fim){
  const t = new Date(), hoje = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate());
  const [y,m,d] = fim.split('-').map(Number); return Math.round((Date.UTC(y,m-1,d) - hoje) / 86400000);
}
function todayIso(){ const t = new Date(); return new Date(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate())).toISOString().slice(0,10); }
function fmtDateTime(iso){ try{ return new Date(iso).toLocaleString('pt-BR'); }catch(e){ return iso; } }
function genToken(){ return Array.from(crypto.getRandomValues(new Uint8Array(24)), b=>b.toString(16).padStart(2,'0')).join(''); }
function logHist(cl, acao, quem, quando){
  (cl.historicoPrazo = cl.historicoPrazo || []).push({quando: quando || new Date().toISOString(), quem: quem || 'equipe', acao});
}
function confirmAct(msg, label, onYes){
  const inner = document.getElementById('modal-inner');
  inner.innerHTML = `<div class="modal"><div class="modal-header"><h3>Confirmar ação</h3><button class="modal-close" id="modal-x">&times;</button></div>
    <p class="muted" style="font-size:13px;">${msg}</p>
    <div class="modal-actions"><button class="btn secondary" id="modal-cancel">Voltar</button><button class="btn danger" id="modal-yes">${label}</button></div></div>`;
  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('modal-x').onclick = closeModal; document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-yes').onclick = ()=>{ closeModal(); onYes(); };
}

async function syncAgendamento(cl){
  const a = cl.agendamento;
  if(!a || !a.token || a.status !== 'Aguardando') return false;
  const snap = await getDoc(doc(db, 'agendamentos', a.token));
  if(!snap.exists()) return false;
  const d = snap.data();
  if(d.status !== 'Confirmado') return false;
  const quando = d.confirmadoEm && d.confirmadoEm.toDate ? d.confirmadoEm.toDate().toISOString() : new Date().toISOString();
  a.status = 'Confirmado'; a.escolhida = d.escolhida; a.confirmadoEm = quando;
  cl.dataInicio = d.escolhida;
  logHist(cl, 'Cliente confirmou o início do projeto em ' + fmtDate(d.escolhida), 'cliente', quando);
  return true;
}
async function syncTodosAgendamentos(){
  let changed = false;
  for(const cl of state.clients){
    try{ if(await syncAgendamento(cl)) changed = true; }catch(e){ console.error('Sync agendamento', e); }
  }
  if(changed) await persist();
}

function openAgendarForm(cl, values, erro){
  openForm({
    title: (erro ? '⚠ ' + erro + ' — ' : '') + 'Agendar início do projeto — ' + escapeHtml(cl.nome), wide:true,
    fields:[
      {key:'d1', label:'Opção de data 1', type:'date'}, {key:'d2', label:'Opção de data 2', type:'date'}, {key:'d3', label:'Opção de data 3', type:'date'},
      {key:'duracaoDias', label:'Duração do contrato (dias corridos)', type:'number'},
      {key:'regra', label:'Regra de contagem do prazo (conforme o contrato assinado)', type:'select', options:['— selecione —', REGRAS.inclui, REGRAS.seguinte]},
      {key:'observacoes', label:'Observações para o cliente', type:'textarea'},
    ],
    values: values || {},
    onSave: async (v)=>{
      const datas = [v.d1, v.d2, v.d3];
      const regra = Object.keys(REGRAS).find(k=>REGRAS[k]===v.regra);
      const bad = datas.some(d=>!d) ? 'Informe as três datas'
        : new Set(datas).size !== 3 ? 'As três datas devem ser diferentes'
        : datas.some(d=>d < todayIso()) ? 'Use apenas datas futuras'
        : !(Number.isInteger(v.duracaoDias) && v.duracaoDias > 0) ? 'Informe a duração em dias (número inteiro)'
        : !regra ? 'Selecione a regra de contagem' : null;
      if(bad){ formError(bad); return false; }
      try{
        const token = genToken(), opcoes = datas.slice().sort();
        await setDoc(doc(db, 'agendamentos', token), {clienteId: cl.id, clienteNome: cl.nome, empresa: cl.empresa || '', opcoes,
          duracaoDias: v.duracaoDias, regra, observacoes: v.observacoes || '', status:'Aguardando', escolhida:null, confirmadoEm:null, criadoEm:new Date().toISOString()});
        const old = cl.agendamento;
        if(old && old.token && (old.status==='Aguardando' || old.status==='Confirmado')){
          await updateDoc(doc(db, 'agendamentos', old.token), {status:'Cancelado'});
          logHist(cl, 'Agendamento anterior substituído (status era "' + old.status + '")');
        }
        cl.agendamento = {token, status:'Aguardando', opcoes, duracaoDias:v.duracaoDias, regra, observacoes:v.observacoes||'', escolhida:null, confirmadoEm:null};
        logHist(cl, 'Agendamento criado com as datas ' + opcoes.map(fmtDate).join(', ') + ' · ' + v.duracaoDias + ' dias · regra: ' + REGRAS[regra]);
        await persist(); showToast('Agendamento criado. Copie o link para o cliente.'); render();
      }catch(e){ console.error(e); formError('Erro ao criar o agendamento. Verifique as regras do Firestore e tente novamente.'); return false; }
    }
  });
}

/* ============================= ARQUIVOS (Firebase Storage) ============================= */
const MIME = {pdf:'application/pdf', doc:'application/msword', docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  xls:'application/vnd.ms-excel', xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg'};
const MAX_MB = 5, PARTE = 700000;
function bufToB64(buf){ const b = new Uint8Array(buf); let r = ''; for(let i=0;i<b.length;i+=0x8000) r += String.fromCharCode.apply(null, b.subarray(i, i+0x8000)); return btoa(r); }
function b64ToBlob(partes, type){ const bin = atob(partes.join('')), u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type}); }
async function salvarPartes(id, f){
  const b64 = bufToB64(await f.arrayBuffer()), n = Math.ceil(b64.length / PARTE);
  await Promise.all(Array.from({length:n}, (_,i)=> setDoc(doc(db,'arquivos',id,'partes',String(i)), {d: b64.slice(i*PARTE, (i+1)*PARTE)})));
  return n;
}
async function lerArquivo(a){
  const snaps = await Promise.all(Array.from({length:a.partes}, (_,i)=> getDoc(doc(db,'arquivos',a.id,'partes',String(i)))));
  if(snaps.some(x=>!x.exists())) throw new Error('parte ausente');
  return b64ToBlob(snaps.map(x=>x.data().d), MIME[a.ext] || 'application/octet-stream');
}
async function apagarPartes(a){ await Promise.all(Array.from({length:a.partes}, (_,i)=> deleteDoc(doc(db,'arquivos',a.id,'partes',String(i))))); }
const CATS_ARQ = ['Contratos','Propostas comerciais','Diagnósticos','Planejamentos','Relatórios','Outros documentos'];
function fmtSize(b){ return b > 1048576 ? (b/1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b/1024)) + ' KB'; }
function extOf(n){ return (n.split('.').pop() || '').toLowerCase(); }

      return `<div class="k" style="margin:14px 0 6px;">${cat}</div>` + g.map(a=>`

    }).join('') : `<div class="card">${emptyState('Nenhum arquivo anexado','Envie contratos, propostas, diagnósticos e relatórios (PDF, Word, Excel, imagens).')}</div>`);

    confirmDelete(`Excluir "${escapeHtml(a.nome)}"? O arquivo será apagado definitivamente.`, async ()=>{
      try{
        await apagarPartes(a);
        state.arquivos = state.arquivos.filter(x=>x.id!==a.id); await persist(); showToast('Arquivo excluído.'); render();
      }catch(e){ console.error(e); showToast('Erro ao excluir o arquivo.'); }
    });
  }));
}
async function baixarArquivo(a, abrir){
  const w = abrir ? window.open('', '_blank') : null;
  try{
    const blob = await lerArquivo(a);
    const url = URL.createObjectURL(blob);
    if(abrir && w){ w.location = url; }
    else { const l = document.createElement('a'); l.href = url; l.download = a.nome; document.body.appendChild(l); l.click(); l.remove(); }
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ if(w) w.close(); console.error(e); showToast('Não foi possível abrir o arquivo (sem permissão ou arquivo ausente).'); }
}
function openUploadModal(cl){
  const inner = document.getElementById('modal-inner');
  inner.innerHTML = `<div class="modal"><div class="modal-header"><h3>Enviar arquivo — ${escapeHtml(cl.nome)}</h3><button class="modal-close" id="modal-x">&times;</button></div>
    <div class="k" style="margin-bottom:4px;">Categoria</div>
    <select id="up-cat" style="width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);">${CATS_ARQ.map(c=>`<option>${c}</option>`).join('')}</select>
    <div class="k" style="margin:12px 0 4px;">Arquivo (PDF, DOC, DOCX, XLS, XLSX, PNG, JPG — até ${MAX_MB} MB)</div>
    <input id="up-file" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg" style="color:var(--text);font-size:12.5px;">
    <div id="up-err" style="color:var(--danger);font-size:12px;min-height:16px;margin-top:8px;"></div>
    <div class="modal-actions"><button class="btn secondary" id="modal-cancel">Cancelar</button><button class="btn" id="up-go">Enviar</button></div></div>`;
  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('modal-x').onclick = closeModal; document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('up-go').onclick = async ()=>{
    const f = document.getElementById('up-file').files[0], err = document.getElementById('up-err');
    if(!f){ err.textContent = 'Selecione um arquivo.'; return; }
    const ext = extOf(f.name);
    if(!MIME[ext]){ err.textContent = 'Formato não permitido.'; return; }
    if(f.size > MAX_MB*1048576){ err.textContent = `Arquivo maior que ${MAX_MB} MB.`; return; }
    const btn = document.getElementById('up-go'); btn.disabled = true; btn.textContent = 'Enviando...'; err.textContent = '';
    const id = uid('arq');
    try{
      const partes = await Promise.race([salvarPartes(id, f), new Promise((_,rej)=> setTimeout(()=> rej(new Error('timeout')), 90000))]);
      state.arquivos.push({id, clienteId: cl.id, nome: f.name, ext, tamanho: f.size, categoria: document.getElementById('up-cat').value, partes,
        enviadoEm: new Date().toISOString(), enviadoPor: ''});
      await persist(); closeModal(); showToast('Arquivo enviado.'); render();
    }catch(e){
      console.error(e);
      try{ await apagarPartes({id, partes: 12}); }catch(_){}
      err.textContent = 'Falha no envio. Confirme que as regras novas do Firestore foram publicadas e tente de novo.'; btn.disabled = false; btn.textContent = 'Enviar';
    }
  };
}

const REGRAS_PUB = {inclui:'O dia de início será contado como o dia 1 do prazo.', seguinte:'A contagem do prazo começa no dia seguinte à data de início.'};
function pubFmt(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}); }
function pubSet(h){ document.getElementById('pub-box').innerHTML = h; }
function pubMsg(t, d){ pubSet(`<h1>${t}</h1><p>${d}</p>`); }
async function iniciarPaginaCliente(){
  document.getElementById('shell').style.display = 'none';
  document.getElementById('pub').style.display = 'flex';
  document.getElementById('pub-logo').src = LOGO_URI;
  document.title = 'Início do projeto — Evastek';
  const token = location.hash.replace('#agendar=', '');
  let sel = null;
  const carregar = async ()=>{
    if(!/^[0-9a-f]{48}$/.test(token)) return pubMsg('Link inválido','Confira o link recebido ou fale com a equipe Evastek.');
    let d;
    try{
      const snap = await getDoc(doc(db,'agendamentos',token));
      if(!snap.exists()) return pubMsg('Link indisponível','Este link não existe ou foi substituído. Fale com a equipe Evastek.');
      d = snap.data();
    }catch(e){ return pubMsg('Não foi possível carregar','Verifique sua conexão e tente novamente em instantes.'); }
    if(d.status==='Confirmado') return concluido(d);
    if(d.status!=='Aguardando') return pubMsg('Agendamento indisponível','Este agendamento foi cancelado ou alterado. Entre em contato com a equipe Evastek para receber um novo link.');
    escolher(d);
  };
  const escolher = (d)=>{
    pubSet(`<h1>Olá, ${escapeHtml(d.clienteNome)}!</h1>
      <p>Estamos organizando o início do seu projeto com a Evastek! Para que possamos preparar nossa equipe e garantir uma execução organizada, disponibilizamos três opções de datas para você escolher aquela que melhor atende à sua disponibilidade.</p>
      <div class="pmeta"><div>Cliente<b>${escapeHtml(d.empresa||d.clienteNome)}</b></div><div>Duração do contrato<b>${escapeHtml(d.duracaoDias)} dias corridos</b></div></div>
      <p class="pnote">A partir da data de início acordada, começará a contagem do prazo contratual, considerando os dias corridos estabelecidos em contrato. ${REGRAS_PUB[d.regra]||''}</p>
      ${d.observacoes ? `<p class="pnote"><b>Observações:</b> ${escapeHtml(d.observacoes)}</p>` : ''}
      <div>${d.opcoes.map(o=>`<button class="popt" data-d="${o}"><span class="dot"></span><span>${pubFmt(o)}</span></button>`).join('')}</div>
      <button class="pbtn" id="pub-go" disabled>Confirmar data escolhida</button>`);
    sel = null;
    document.querySelectorAll('#pub .popt').forEach(b=> b.onclick = ()=>{ sel = b.dataset.d; document.querySelectorAll('#pub .popt').forEach(x=>x.classList.toggle('sel', x===b)); document.getElementById('pub-go').disabled = false; });
    document.getElementById('pub-go').onclick = ()=> confirmar(d);
  };
  const confirmar = (d)=>{
    pubSet(`<h1>Confirmar esta data?</h1><p>Você escolheu <b>${pubFmt(sel)}</b> como início do projeto. Depois de confirmada, a escolha não poderá ser alterada por aqui.</p>
      <div class="perr" id="pub-err"></div><button class="pbtn" id="pub-yes">Sim, confirmar</button><button class="pbtn ghost" id="pub-no">Voltar</button>`);
    document.getElementById('pub-no').onclick = ()=> escolher(d);
    document.getElementById('pub-yes').onclick = async ()=>{
      const b = document.getElementById('pub-yes'); b.disabled = true; b.textContent = 'Confirmando...';
      try{ await updateDoc(doc(db,'agendamentos',token), {status:'Confirmado', escolhida:sel, confirmadoEm:serverTimestamp()}); await carregar(); }
      catch(e){
        if(e && e.code==='permission-denied') await carregar();
        else { document.getElementById('pub-err').textContent = 'Não foi possível confirmar. Tente novamente.'; b.disabled = false; b.textContent = 'Sim, confirmar'; }
      }
    };
  };
  const concluido = (d)=>{
    const q = d.confirmadoEm && d.confirmadoEm.toDate ? d.confirmadoEm.toDate().toLocaleString('pt-BR') : '';
    pubSet(`<div class="pok">✓</div><h1 style="margin-top:10px;">Início confirmado!</h1>
      <p>O início do seu projeto está agendado para <b>${pubFmt(d.escolhida)}</b>.</p>${q ? `<p class="pnote">Confirmado em ${q}.</p>` : ''}
      <p class="pnote">Nossa equipe já foi informada. Qualquer dúvida, é só falar com a Evastek.</p>`);
  };
  carregar();
}

    openForm({title:'Novo usuário', fields:[{key:'nome',label:'Nome'},{key:'funcao',label:'Função',type:'select',options:['Administrador','Estrategista','Social Media','Designer','Comercial']},{key:'email',label:'Email'}],
      values:{funcao:'Estrategista'},
      onSave: async (v)=>{ state.users.push(Object.assign({id:uid('user')}, v)); await persist(); showToast('Usuário adicionado.'); render(); }});
  });
  c.querySelectorAll('[data-del-user]').forEach(b=> b.addEventListener('click', ()=>{
    const u = state.users.find(u=>u.id===b.dataset.delUser);
    const refCount = ['clients','projects','tasks','meetings'].reduce((sum,key)=> sum + state[key].filter(item=>item.responsavel===u.nome).length, 0);
    const msg = refCount
      ? `Remover "${escapeHtml(u.nome)}" da equipe? ${refCount} item(ns) ainda o(a) têm como responsável — eles não serão apagados, apenas ficarão sem responsável atribuído.`
      : `Remover "${escapeHtml(u.nome)}" da equipe?`;
    confirmDelete(msg, async ()=>{ state.users = state.users.filter(u=>u.id!==b.dataset.delUser); await persist(); showToast('Usuário removido.'); render(); });
  }));
}
function statusBadgeRole(f){
  const map={'Administrador':'red','Estrategista':'green','Social Media':'blue','Designer':'amber','Comercial':'gray'};
  return `<span class="badge ${map[f]||'gray'}">${escapeHtml(f)}</span>`;
}

function helpKey(){ return (view.section==='clientes' && view.clientId) ? 'c_'+view.clientTab : 'p_'+view.section; }
function openAjuda(key){
  const h = AJUDA[key]; if(!h){ showToast('Sem ajuda para esta tela.'); return; }
  const inner = document.getElementById('modal-inner');
  inner.innerHTML = `<div class="modal wide">
    <div class="modal-header"><h3>${icon('help')} Ajuda: ${h.t}</h3><button class="modal-close" id="modal-x" aria-label="Fechar">&times;</button></div>
    <div class="ajuda-sec"><h4>Para que serve</h4><p>${h.serve}</p></div>
    <div class="ajuda-sec"><h4>Quando usar</h4><p>${h.quando}</p></div>
    <div class="ajuda-sec"><h4>Passo a passo</h4><ol>${h.passos.map(p=>`<li>${p}</li>`).join('')}</ol></div>
    ${h.dica ? `<div class="ajuda-sec ajuda-tip"><strong>Dica:</strong> ${h.dica}</div>` : ''}
    <div class="modal-actions"><button class="btn secondary" id="aj-guia">Ver guia completo</button><button class="btn" id="modal-cancel">Entendi</button></div>
  </div>`;
  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('modal-x').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('aj-guia').onclick = ()=>{ closeModal(); goto('guia'); };
}

/* ============================= MAIN RENDER ============================= */
function render(){
  renderSidebar();
  renderTopbar();
  if(view.section==='dashboard') renderDashboard();
  else if(view.section==='clientes') view.clientId ? renderClienteDetail() : renderClientesList();
  else if(view.section==='tarefas') renderTarefasGlobal();
  else if(view.section==='guia') renderGuia();
  else if(view.section==='biblioteca') renderBiblioteca();
  else if(view.section==='config') renderConfig();
}

/* ============================= BOOT ============================= */
async function boot(){
  document.getElementById('content').innerHTML = `<div class="loading-state">Carregando Evastek OS...</div>`;
  await loadState();
  state.arquivos = state.arquivos || [];
  render();
  syncTodosAgendamentos().then(()=>{ if(view.section==='clientes') render(); });
}
document.getElementById('modal-overlay').addEventListener('click', (e)=>{ if(e.target.id==='modal-overlay' && !e.currentTarget.dataset.lock) closeModal(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && document.getElementById('modal-overlay').classList.contains('show')) closeModal(); });
if(PUBLIC_MODE){ iniciarPaginaCliente(); } else { boot(); }

/* ============================= PWA ============================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch((e)=> console.error('Falha ao registrar service worker', e));
  });
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallButton();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  hideInstallButton();
  showToast('Evastek OS instalado.');
});

function showInstallButton(){
  if(PUBLIC_MODE) return;
  if(document.getElementById('pwa-install-btn')) return;
  const btn = document.createElement('button');
  btn.id = 'pwa-install-btn';
  btn.textContent = 'Instalar app';
  btn.style.cssText = 'position:fixed;bottom:18px;right:18px;z-index:50;background:var(--accent);color:#F2F4FA;border:none;padding:11px 16px;border-radius:24px;font-family:var(--font-b);font-size:12.5px;font-weight:600;box-shadow:0 8px 24px rgba(1,88,254,.35);cursor:pointer;';
  btn.addEventListener('click', async ()=>{
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    hideInstallButton();
  });
  document.body.appendChild(btn);
}
function hideInstallButton(){
  const btn = document.getElementById('pwa-install-btn');
  if(btn) btn.remove();
}
</script>
